services:
  postgres:
    image: postgres:16-alpine
    container_name: wedding-postgres
    environment:
      POSTGRES_USER: wedding
      POSTGRES_PASSWORD: wedding123
      POSTGRES_DB: wedding_invitation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wedding -d wedding_invitation"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data: